format = """
[░▒▓](#a3d2a3)\
[  ](bg:#a3d2a3 fg:#090c0c)\
[](bg:#66b466 fg:#a3d2a3)\
$directory\
[](fg:#66b466 bg:#448c44)\
$git_branch\
$git_status\
[](fg:#448c44 bg:#1d3c1d)\
$nodejs\
$rust\
$golang\
$php\
[](fg:#1d3c1d bg:#1d2230)\
$time\
[ ](fg:#1d2230)\
\n$character"""

[directory]
style = "fg:#ffffff bg:#70b970"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#448c44"
format = '[[ $symbol $branch ](fg:#70b970 bg:#448c44)]($style)'

[git_status]
style = "bg:#448c44"
format = '[[($all_status$ahead_behind )](fg:#70b970 bg:#448c44)]($style)'

[nodejs]
symbol = ""
style = "bg:#1d3c1d"
format = '[[ $symbol ($version) ](fg:#70b970 bg:#1d3c1d)]($style)'

[rust]
symbol = ""
style = "bg:#1d3c1d"
format = '[[ $symbol ($version) ](fg:#70b970 bg:#1d3c1d)]($style)'

[golang]
symbol = ""
style = "bg:#1d3c1d"
format = '[[ $symbol ($version) ](fg:#70b970 bg:#1d3c1d)]($style)'

[php]
symbol = ""
style = "bg:#1d3c1d"
format = '[[ $symbol ($version) ](fg:#70b970 bg:#1d3c1d)]($style)'

[time]
disabled = false
time_format = "%T" # Hour:Minute Format
style = "bg:#1d2230"
format = '[[  $time ](fg:#a0a9cb bg:#1d2230)]($style)'
